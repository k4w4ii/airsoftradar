name: keepalive
# Publikus repóban a GitHub 60 nap commit-inaktivitás után letiltja az ütemezett workflow-kat.
# Havi egy automatikus commit ezt megakadályozza.

on:
  schedule:
    - cron: "41 3 1 * *"        # minden hónap 1-jén 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Commit timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive [skip ci]"
          git push

name: daily-scrape

on:
  schedule:
    - cron: "17 2 * * *"        # 02:17 UTC, éjszaka -> kíméli a boltokat
  workflow_dispatch:
    inputs:
      limit:
        description: "Max termék / bolt (teszthez)"
        required: false
        type: number

# a GITHUB_TOKEN csak olvashat (a scraper nem ír a repóba)
permissions:
  contents: read

# a kézi újrapárosítás (rematch) megvárja, amíg ez fut, és fordítva
concurrency:
  group: airsofthunter-db
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scraper/mnb_rates.py

  scrape:
    needs: rates
    runs-on: ubuntu-latest
    timeout-minutes: 330          # GitHub max. 360; a scraper 300 perc után magától leáll és ment
    env:
      SCRAPE_BUDGET_MIN: "300"
    strategy:
      fail-fast: false           # egy bolt hibája ne állítsa le a többit
      max-parallel: 6
      matrix:
        shop: [gunfire, taiwangun, evike-europe, powair6, airsoftpro, combat-zone, airsoftplaza, airsoftcentrum,
               begadi, airsoftsports, airsoft-guns-eu, airsoftmania, gunshot, vsgun, airsoft-legends, bunker501,
               phenixairsoft, militaria, redberet, atom-airsoft]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # a kézi „limit” érték környezeti változóként megy át, nem kerül közvetlenül a parancssorba
      - env:
          SHOP: ${{ matrix.shop }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            case "$LIMIT" in (*[!0-9]*) echo "hibás limit"; exit 1;; esac
            python scraper/run_shop.py "$SHOP" --limit "$LIMIT"
          else
            python scraper/run_shop.py "$SHOP"
          fi

  refresh:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scraper/run_shop.py --refresh
      # Next.js ISR újraépítés (opcionális): curl -X POST "$REVALIDATE_URL?secret=$REVALIDATE_SECRET"

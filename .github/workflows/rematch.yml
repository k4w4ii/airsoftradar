name: rematch

# Kézi indítás: Actions -> rematch -> Run workflow. Letöltés nélkül újrapárosítja a 'pending' ajánlatokat,
# egységesíti a termékneveket és frissíti a weboldalt (pár perc). Takarító SQL (pl. 0012) után futtasd.
on:
  workflow_dispatch:

permissions:
  contents: read

# ne fusson egyszerre az éjszakai letöltéssel (megvárja)
concurrency:
  group: airsofthunter-db
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"       # a napló azonnal látszik (nem pufferelve)
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  # Cloudflare D1: a GitHub „DB_BACKEND” változó d1-re állításával vált át a scraper (TELEPITES.md 20. pont)
  DB_BACKEND: ${{ vars.DB_BACKEND }}
  D1_API_URL: ${{ vars.D1_API_URL }}
  D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}

jobs:
  rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scraper/rematch.py

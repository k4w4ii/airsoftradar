name: brands
# Ismeretlen márkák listája (scraper/unknown_brands.py). Kézzel: Actions → brands → Run workflow.
# Eredmény: a futás Summary oldalán táblázat, alul az „ismeretlen-markak” csatolmány (CSV) letölthető.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  D1_API_URL: ${{ vars.D1_API_URL }}
  D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}

jobs:
  brands:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python scraper/unknown_brands.py
      - uses: actions/upload-artifact@v4
        continue-on-error: true      # a GitHub tárhelye néha hibázik: a CSV nem kritikus, a futás ettől még sikeres
        timeout-minutes: 3
        with:
          name: ismeretlen-markak
          path: ismeretlen_markak.csv
          retention-days: 7
